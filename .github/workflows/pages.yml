name: Deploy playground

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Verify playground assets
        run: |
          for asset in index.html style.css engine.js examples.js json-view.js app.js; do
            test -s "web/$asset"
          done
      - name: Package static playground
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish playground
        id: deployment
        uses: actions/deploy-pages@v4
