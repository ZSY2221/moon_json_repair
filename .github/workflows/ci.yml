name: MoonBit CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version
      - run: moon fmt --check
        if: matrix.backend == 'wasm-gc'
      - run: moon check --target "$TARGET" --deny-warn
        env:
          TARGET: ${{ matrix.backend }}
      - run: moon test --target "$TARGET" --deny-warn
        env:
          TARGET: ${{ matrix.backend }}
      - name: Compile README API examples as a separate consumer
        run: node tools/verify-readme.mjs "$GITHUB_WORKSPACE" "$TARGET"
        env:
          TARGET: ${{ matrix.backend }}
      - run: moon doc
        if: matrix.backend == 'wasm-gc'
      - run: moon package --list
        if: matrix.backend == 'wasm-gc'
      - run: node web/build.mjs
        if: matrix.backend == 'js'
      - name: Verify corpus outcomes against strict JSON
        run: node tools/eval-corpus.mjs
        if: matrix.backend == 'js'
      - name: Verify real Native pipes and exit codes
        run: node tools/cli-smoke.mjs
        if: matrix.backend == 'native'
